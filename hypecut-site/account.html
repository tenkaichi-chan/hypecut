<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your account · Hypecut</title>
<meta property="og:site_name" content="Hypecut">
<meta name="theme-color" content="#0b0918">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="application-name" content="Hypecut">
<meta name="apple-mobile-web-app-title" content="Hypecut">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root { --bg: #0b0918; --panel: #19153a; --line: #2c2760; --fg: #f4f2ff; --muted: #a9a4d4; --hot: #ff3d8b; --cta: #ffd23f; --cta-ink: #1a1300; --ok: #3ee6a8; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 16px/1.6 "Inter", system-ui, sans-serif; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
main { width: 100%; max-width: 460px; display: grid; gap: 18px; }
a { color: var(--cta); }
h1 { font-family: "Chakra Petch", sans-serif; text-transform: uppercase; font-size: 2rem; line-height: 1.05; margin: 0; }
p { margin: 0; color: var(--muted); }
.card { background: var(--panel); border-radius: 20px; padding: 24px; box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 14px; }
label { font-family: "JetBrains Mono", monospace; font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
input { font: inherit; font-family: "JetBrains Mono", monospace; background: var(--bg); color: var(--fg); border: 0; border-radius: 12px; box-shadow: inset 0 0 0 1.5px var(--line); padding: 13px 14px; width: 100%; }
input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--cta); }
button { font-family: "Chakra Petch", sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 1rem; padding: 14px 20px; border: 0; border-radius: 14px; background: var(--cta); color: var(--cta-ink); cursor: pointer; }
button[disabled] { opacity: .6; cursor: progress; }
.status { display: none; gap: 4px; padding: 12px 14px; border-radius: 12px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); }
.status.show { display: grid; }
.status b { color: var(--fg); }
.on { color: var(--ok); } .off { color: var(--hot); }
.msg { min-height: 1.4em; font-size: .92rem; } .msg.err { color: var(--hot); }
.back { text-decoration: none; font-weight: 600; }
:focus-visible { outline: 3px solid var(--cta); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <a class="back" href="/">← Hypecut</a>
  <h1>Your account</h1>
  <p>Manage your Pro subscription: update your card, cancel, or download invoices. You'll be taken to our payment provider's secure billing page.</p>
  <form class="card" id="form" novalidate>
    <label for="key">Your Pro key</label>
    <input id="key" type="text" placeholder="HC-XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <button type="submit" id="go">Open billing portal</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
  <p>Lost your key? Email <a href="mailto:sehbag11@gmail.com">sehbag11@gmail.com</a> from your purchase email.</p>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var key = $("key"), msg = $("msg"), st = $("status"), go = $("go");
  try { var saved = JSON.parse(localStorage.getItem("hypecut-pro") || "null"); if (saved && saved.key) key.value = saved.key; } catch (e) {}
  function say(t, err) { msg.textContent = t || ""; msg.className = "msg" + (err ? " err" : ""); }
  function call(path, k) {
    return fetch(path, { method: "POST", headers: { Authorization: "Bearer " + k, Accept: "application/json" } })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); });
  }
  async function showStatus(k) {
    var r = await call("/api/paddle/access", k);
    if (!r.ok) { st.className = "status"; return r; }
    var d = r.d, h = "<span>Subscription: <b class=\"" + (d.access ? "on" : "off") + "\">" + (d.access ? "Pro is active" : "Pro is not active") + "</b> (" + d.status + ")</span>";
    if (d.scheduledChange) h += "<span>Scheduled: <b>" + d.scheduledChange.action + "</b> on " + String(d.scheduledChange.at || "").slice(0, 10) + ". You keep Pro until then.</span>";
    st.innerHTML = h; st.className = "status show";
    return r;
  }
  $("form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var k = key.value.trim().toUpperCase();
    if (!/^HC-[A-Z0-9]{4}(-[A-Z0-9]{4}){3}$/.test(k)) return say("Enter your Pro key. It starts with HC-.", true);
    go.disabled = true; say("Checking…");
    try {
      var s = await showStatus(k);
      if (!s.ok) { say(s.d.error || "We couldn't find that Pro key.", true); return; }
      say("Opening your billing portal…");
      var p = await call("/api/paddle/portal", k);
      if (p.ok && p.d.url) { location.href = p.d.url; return; }
      say(p.d.error || "Couldn't open the billing portal. Try again in a minute.", true);
    } catch (err) { say("Couldn't reach the server. Check your connection and try again.", true); }
    finally { go.disabled = false; }
  });
})();
</script>
</body>
</html>
