<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Hypecut</title>
<meta name="theme-color" content="#0b0918">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Cpolygon points='0,0 7,0 10,5 7,10 0,10 3,5' fill='%23ff3d8b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root { --bg: #0b0918; --fg: #f4f2ff; --muted: #a9a4d4; --hot: #ff3d8b; --hot-2: #b14dff; --cta: #ffd23f; --cta-ink: #1a1300; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Inter", system-ui, sans-serif; display: grid; place-items: center; text-align: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); overflow: hidden; }
body::before { content: ""; position: fixed; width: 60vmax; height: 60vmax; border-radius: 50%; background: var(--hot); filter: blur(120px); opacity: .25; top: -30vmax; right: -20vmax; z-index: -1; }
.code { font-family: "Chakra Petch", "Arial Black", sans-serif; font-size: clamp(6rem, 24vw, 12rem); line-height: .9; background: linear-gradient(100deg, var(--cta), var(--hot) 55%, var(--hot-2)); -webkit-background-clip: text; background-clip: text; color: transparent; animation: glitch 2.4s steps(1) infinite; }
@keyframes glitch { 0%, 92%, 100% { transform: none; } 94% { transform: translate(-4px, 2px) skewX(-6deg); } 96% { transform: translate(4px, -2px) skewX(6deg); } }
h1 { font-family: "Chakra Petch", sans-serif; text-transform: uppercase; font-size: clamp(1.6rem, 5vw, 2.4rem); margin: 12px 0 10px; }
p { color: var(--muted); margin: 0 0 28px; font-size: 1.05rem; }
small { display: block; font-family: "JetBrains Mono", monospace; color: var(--muted); margin-bottom: 26px; letter-spacing: .08em; }
a { display: inline-block; font-family: "Chakra Petch", sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 15px 26px; border-radius: 14px; background: var(--cta); color: var(--cta-ink); text-decoration: none; transition: transform .3s; }
a:hover { transform: translateY(-3px); }
a:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .code { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>You fell off the map</h1>
  <small>RESPAWNING AT CHECKPOINT…</small>
  <p>This page doesn't exist. The good stuff is back on the main page.</p>
  <a href="/">Back to Hypecut</a>
</main>
</body>
</html>
